name: Проверка Helpdesk
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Тесты и сборка
        run: ./gradlew clean test bootJar cyclonedxBom --no-daemon
      - name: Состав поставки
        run: python3 scripts/package_sbom.py --output build/reports/sbom-runtime.cdx.json
      - name: Документация
        run: python3 scripts/check_docs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-and-sbom
          path: |
            build/test-results/test/
            build/reports/cyclonedx/bom.json
            build/reports/sbom-runtime.cdx.json
